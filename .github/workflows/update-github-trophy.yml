name: Update GitHub trophy badge

# The site's avatar-corner badge used to load github-profile-trophy.vercel.app
# live, at page-load time. That endpoint is unreliable (see its own README on
# hosting-cost risk, plus several 2026 issues of it 403ing or not rendering),
# which is exactly what showed up as a broken image on the live site. Instead,
# this workflow fetches the trophy SVGs on a schedule and commits them into
# public/, so the site only ever serves its own static asset — if a run here
# fails because the endpoint is down that day, the previously committed SVG
# just stays as-is (stale, never broken) until the next successful run.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-trophy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trophy SVGs
        env:
          GITHUB_HANDLE: krishanmurariji
        run: |
          set -euo pipefail
          BASE="https://github-profile-trophy.vercel.app/"
          curl -fsSL "${BASE}?username=${GITHUB_HANDLE}&theme=flat&column=3&row=2&no-frame=true&no-bg=true" -o /tmp/github-trophy-light.svg
          curl -fsSL "${BASE}?username=${GITHUB_HANDLE}&theme=onedark&column=3&row=2&no-frame=true&no-bg=true" -o /tmp/github-trophy-dark.svg
          test -s /tmp/github-trophy-light.svg
          test -s /tmp/github-trophy-dark.svg
          cp /tmp/github-trophy-light.svg public/github-trophy-light.svg
          cp /tmp/github-trophy-dark.svg public/github-trophy-dark.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-trophy-light.svg public/github-trophy-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub trophy badge"
            git push
          fi
