<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO — the title/description are written for the exact
         searches this site should surface for ("Krishan Murari",
         "Krishan Murari developer", "Krishan Murari software engineer"),
         not a generic tagline. Domain below is krishan.is-a.dev — update
         every absolute URL on this page (canonical, og:url, og:image,
         twitter:image, and the JSON-LD "url"/"image" below) together if
         that ever changes, they all assume the same origin. -->
    <title>Krishan Murari — Full Stack Developer &amp; Software Engineer</title>
    <meta
      name="description"
      content="Krishan Murari is a Full Stack Developer building scalable web apps with C#, ASP.NET Core, Angular, and TypeScript — HRMS, telehealth, and SaaS platforms with AI integrations like GPT-4o."
    />
    <meta name="author" content="Krishan Murari" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://krishan.is-a.dev/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Krishan Murari" />
    <meta property="og:title" content="Krishan Murari — Full Stack Developer & Software Engineer" />
    <meta
      property="og:description"
      content="Krishan Murari is a Full Stack Developer building scalable web apps with C#, ASP.NET Core, Angular, and TypeScript — HRMS, telehealth, and SaaS platforms with AI integrations like GPT-4o."
    />
    <meta property="og:url" content="https://krishan.is-a.dev/" />
    <meta property="og:image" content="https://krishan.is-a.dev/android-chrome-512x512.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Krishan Murari — Full Stack Developer & Software Engineer" />
    <meta
      name="twitter:description"
      content="Krishan Murari is a Full Stack Developer building scalable web apps with C#, ASP.NET Core, Angular, and TypeScript."
    />
    <meta name="twitter:image" content="https://krishan.is-a.dev/android-chrome-512x512.png" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400&family=Open+Sans:wght@600;700&family=Yatra+One&display=swap" rel="stylesheet" />

    <!-- Structured data (schema.org Person) — this is what lets Google
         show a knowledge-panel-style result (photo, job title, social
         links) when someone searches "Krishan Murari" by name, rather than
         just a plain blue link. The `sameAs` URLs are the same ones this
         site's own footer/profile pages use (see shared.tsx), kept in sync
         by hand since this file can't import from src/. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Krishan Murari",
        "url": "https://krishan.is-a.dev/",
        "image": "https://krishan.is-a.dev/android-chrome-512x512.png",
        "jobTitle": "Full Stack Developer",
        "description": "Full Stack Developer building scalable web applications with C#, ASP.NET Core, Angular, and TypeScript.",
        "email": "mailto:murari@krishan.is-a.dev",
        "sameAs": [
          "https://github.com/krishanmurariji",
          "https://www.linkedin.com/in/krishansinghmurari/",
          "https://www.instagram.com/krishanmurariji/",
          "https://twitter.com/KrishanMuraari"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
